name: gateway checks
on: [push, pull_request]
jobs:
  gateway-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.12.3'
      - run: uv sync --locked --python 3.11
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
