name: gateway checks
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway-checks-matrix:
    name: gateway-checks (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: Plain language (ASD-STE100 sentence limit)
        run: python3 scripts/check_ste.py README.md CONTRIBUTING.md SUPPORT.md docs/first-success.md docs/wifi-devices.md docs/always-on.md docs/updates.md
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m grok_gadgets_gateway.demo
      - run: uv build
      - name: Package metadata renders on PyPI (nothing is uploaded)
        run: uvx --from 'twine==7.0.0' twine check --strict dist/*
  first-success:
    # The README quick start from a clean checkout, including the Grok Bot rehearsal. Nightly too.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.3'
      - run: python3 scripts/check_first_success.py
  gateway-checks:
    name: gateway-checks
    if: always()
    needs: [gateway-checks-matrix, first-success]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python version
        env:
          MATRIX_RESULT: ${{ needs.gateway-checks-matrix.result }}
          FIRST_SUCCESS_RESULT: ${{ needs.first-success.result }}
        run: test "$MATRIX_RESULT" = success && test "$FIRST_SUCCESS_RESULT" = success
