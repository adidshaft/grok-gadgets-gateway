name: gateway checks
on:
  push:
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway-checks-matrix:
    name: gateway-checks (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -q
      - run: uv run --locked python -m grok_gadgets_gateway.demo
      - run: uv build
  first-success:
    # The README quick start from a clean checkout, driven by MCP Inspector. Nightly too.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.3'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: python3 scripts/check_first_success.py
  gateway-checks:
    name: gateway-checks
    if: always()
    needs: [gateway-checks-matrix, first-success]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Python version
        env:
          MATRIX_RESULT: ${{ needs.gateway-checks-matrix.result }}
          FIRST_SUCCESS_RESULT: ${{ needs.first-success.result }}
        run: test "$MATRIX_RESULT" = success && test "$FIRST_SUCCESS_RESULT" = success
