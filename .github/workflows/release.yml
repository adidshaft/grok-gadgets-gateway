name: release packages
# Started by hand for one tag; nothing runs on push. It builds once, writes SHA256SUMS with
# plain file names, checks it in a fresh folder, and attaches the files to the tag's GitHub
# release. With publish_pypi it also uploads to PyPI through trusted publishing (OIDC): no
# token is stored. The `pypi` environment can require the owner's approval.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example v0.1.0-alpha.7
        required: true
      publish_pypi:
        description: Also upload to PyPI
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.3'
      - name: Tag matches the package version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, re, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)\.(\d+))?", tag)
          short = {"alpha": "a", "beta": "b", "rc": "rc"}
          expected = match and match[1] + (short[match[2]] + match[3] if match[2] else "")
          if expected != version:
              raise SystemExit(f"Tag {tag} does not match version {version}")
          PY
      - run: uv build --out-dir dist
      - name: Package metadata renders on PyPI
        run: uvx --from 'twine==7.0.0' twine check --strict dist/*
      - name: Write SHA256SUMS with plain file names
        run: |
          mkdir sums
          (cd dist && sha256sum -- *.whl *.tar.gz) > sums/SHA256SUMS
          cat sums/SHA256SUMS
      - name: Check SHA256SUMS in a fresh folder, as a downloader would
        run: |
          mkdir fresh
          cp dist/* sums/SHA256SUMS fresh/
          cd fresh && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sums
          path: sums/
          if-no-files-found: error
  github-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Attach to the release, or confirm the attached files are the same build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS; then
            # Already attached (for example, a later PyPI-only run): never replace an asset.
            # Upload only if this build is byte-identical to the published files.
            gh release download "$TAG" --pattern SHA256SUMS --output published.sums
            cmp published.sums assets/SHA256SUMS
            echo "The release already has these exact files."
          else
            gh release upload "$TAG" assets/*
          fi
  pypi:
    if: inputs.publish_pypi
    needs: [build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/grok-gadgets-gateway/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
