name: Documentation improvement
description: Help make a setup or explanation clearer
labels:
- docs
body:
- type: input
  id: page
  attributes:
    label: Page or source file
  validations:
    required: true
- type: textarea
  id: confusion
  attributes:
    label: Attempted step and what was confusing
  validations:
    required: true
- type: textarea
  id: suggestion
  attributes:
    label: Suggested improvement
    description: An exact proposal is helpful but optional.
  validations:
    required: false
