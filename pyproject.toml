[project]
name = "grok-gadgets-gateway"
version = "0.1.0a1"
description = "Local Grok Gadgets MCP gateway and device protocol"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mcp==1.26.0", "jsonschema==4.26.0", "pyserial==3.5"]
[project.scripts]
grok-gadgets-gateway = "grok_gadgets_gateway.cli:main"
[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.14"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel.force-include]
"protocol" = "grok_gadgets_gateway/protocol"
