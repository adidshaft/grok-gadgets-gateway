[project]
name = "grok-gadgets-gateway"
version = "0.1.0a4"
description = "Local Grok Gadgets MCP gateway and device protocol"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "adidshaft" }]
keywords = ["mcp", "grok", "gadgets", "iot", "simulator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
dependencies = ["mcp==2.3.0", "httpx2==2.13.1", "jsonschema==4.26.0", "pyserial==3.5"]

[project.urls]
Homepage = "https://grok-gadgets.pages.dev/"
Source = "https://github.com/adidshaft/grok-gadgets-gateway"
Issues = "https://github.com/adidshaft/grok-gadgets-gateway/issues"
Changelog = "https://github.com/adidshaft/grok-gadgets-gateway/blob/main/CHANGELOG.md"
[project.scripts]
grok-gadgets-gateway = "grok_gadgets_gateway.cli:main"
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.hatch.build.targets.wheel.force-include]
"protocol" = "grok_gadgets_gateway/protocol"
